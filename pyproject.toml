[project]
name = "hermes-anvil"
version = "0.1.0"
description = "Guided deployment harness that hatches a Hermes Agent instance in an attendee's own GCP project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
    "mcp>=1.0",
    "google-cloud-secret-manager>=2.20",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.scripts]
hermes-anvil = "hermes_anvil.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
